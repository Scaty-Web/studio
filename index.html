<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="google" value="notranslate">
    <meta name="description" content="PenguinMod is a TurboWarp mod that was made to add tons of cool stuff to allow for crazy projects." />
    <title>Scaty studio - A mod of PenguinMod</title>
    <link rel="apple-touch-icon" href="./images/apple-touch-icon.png">
    <link rel="icon" type="image/x-icon" href="./static/favicon.ico">
    
    <link rel="manifest" href="./manifest.webmanifest">
    
    <style>
      #splash {
        position: absolute; width: 100%; height: 100%; top: 0; left: 0;
        display: flex; align-items: center; justify-content: center;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; 
        color: #8e44ad; /* Mavi/Kırmızı yerine MOR yapıldı */
      }
      .tw-loaded #splash, #splash-content { display: none; }
      #splash[splash-theme="dark"] { background-color: #333; color: #fff; }
      #splash-spinner:after {
        content: " "; display: block; width: 64px; height: 64px;
        border-radius: 50%; border: 6px solid; 
        border-color: #8e44ad #e74c3c #8e44ad #e74c3c; /* MOR ve KIRMIZI geçişli spinner */
        animation: splash-spinner 1.2s linear infinite;
      }
      @keyframes splash-spinner {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* Editör Renklerini Ezme (CSS Injection) */
      [class*="menu-bar_menu-bar"] {
        background-color: #6a0dad !important; /* Menü Barı: Koyu Mor */
      }
      [class*="gui_extension-button-container"] {
        background-color: #ff0000 !important; /* Eklenti Butonu: Saf Kırmızı */
      }
      [class*="stop-all_stop-all"] {
        background-color: #ff4c4c !important; /* Durdurma Butonu: Parlak Kırmızı */
      }
      [class*="is-selected"] {
        background-color: #8e44ad !important; /* Seçili öğeler: Mor */
      }

      /* Yeni Butonun Stili (Feedback butonuna benzemesi için) */
      .scaty-back-button {
        background: #8e44ad;
        color: white;
        border: none;
        padding: 0 1rem;
        height: 2.25rem;
        border-radius: 0.5rem;
        font-family: inherit;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        margin-left: 0.5rem;
        text-decoration: none;
        font-size: 0.85rem;
      }
      .scaty-back-button:hover {
        background: #9b59b6;
      }
    </style>
    <link rel="dns-prefetch" href="https://trampoline.turbowarp.org/">
    <link rel="dns-prefetch" href="https://projects.scratch.mit.edu/">
    <link rel="dns-prefetch" href="https://assets.scratch.mit.edu/">
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <noscript>
        <h1>Enable JavaScript</h1>
      </noscript>
      <div id="splash-content">
        <div id="splash-spinner"></div>
      </div>
    </div>
    <script>
      (function() {
        document.querySelector('#splash-content').style.display = 'block';
        
        try {var localTheme = localStorage.getItem('tw:theme');} catch (e) {}
        if (localTheme ? localTheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches) document.querySelector('#splash').setAttribute('splash-theme', 'dark');
        
        // Menü barı yüklendiğinde butonu oraya ekleyen script
        const interval = setInterval(() => {
          const menuBar = document.querySelector('[class*="menu-bar_main-menu"]');
          if (menuBar && !document.querySelector('.scaty-back-button')) {
            const btn = document.createElement('a');
            btn.className = 'scaty-back-button';
            btn.href = 'https://scaty-web.github.io';
            btn.innerText = 'Back to Scaty';
            // Feedback butonunun yanına ekler
            menuBar.appendChild(btn);
          }
        }, 1000);
      })();
    </script>
    <div id="app"></div>

    <script src="./js/vendors~addon-settings~credits~editor~embed~fullscreen~player.js"></script>
    <script src="./js/vendors~editor~embed~fullscreen~player.js"></script>
    <script src="./js/addon-settings~addons~editor~fullscreen~player.js"></script>
    <script src="./js/editor~embed~fullscreen~player.js"></script>
    <script src="./js/player.js"></script>
  </body>
</html>
